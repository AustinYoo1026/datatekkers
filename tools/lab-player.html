<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Lab</title>
<style>
  :root { --bg: #0f1419; --panel: rgba(18, 24, 32, 0.92); --ink: #e6ebf2; --dim: #8a96a8; --line: #2a3442; --acc: #f1735f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; top: 12px; left: 12px; width: 300px; max-width: calc(100vw - 24px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-sizing: border-box; }
  #ui h1 { margin: 0 0 8px; font-size: 14px; letter-spacing: 0.04em; }
  #ui h1 span { color: var(--acc); }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { width: 62px; color: var(--dim); flex: none; }
  .row select, .row input[type=range] { flex: 1; min-width: 0; }
  select { background: #1a2230; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px; }
  .chk { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 4px; color: var(--dim); }
  .chk label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  button { background: #1a2230; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; flex: 1; }
  #uval, #rval { width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
  #info { margin-top: 8px; color: var(--dim); font-size: 11px; white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; }
  #err { color: #ff8a7a; white-space: pre-wrap; }
  #hint { position: fixed; right: 12px; bottom: 10px; color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <h1>PLAYER <span>LAB</span></h1>
  <div class="row"><label for="selPlayer">Player</label><select id="selPlayer"></select></div>
  <div class="row"><label for="selSkin">Skin</label><select id="selSkin"></select></div>
  <div class="row"><label for="selState">State</label><select id="selState"></select></div>
  <div class="row"><label for="selSkill">Skill</label><select id="selSkill"></select></div>
  <div class="row"><label for="selSide">Side</label><select id="selSide"><option value="1">right</option><option value="-1">left</option></select>
    <label for="selFoot" style="width:auto">Foot</label><select id="selFoot"><option value="1">right</option><option value="-1">left</option></select></div>
  <div class="row"><label for="rngU">time</label><input id="rngU" type="range" min="0" max="1" step="0.002" value="0"><span id="uval">0.00</span></div>
  <div class="row"><label for="rngRate">Speed</label><input id="rngRate" type="range" min="0.02" max="2" step="0.02" value="1"><span id="rval">1.00</span></div>
  <div class="row"><label>Frame</label><button id="btnBack" title=",">&#9664; step</button><button id="btnPlay" title="space">pause</button><button id="btnFwd" title=".">step &#9654;</button></div>
  <div class="chk">
    <label><input id="chkSeq" type="checkbox" checked> jog &gt; clip &gt; jog</label>
    <label><input id="chkTravel" type="checkbox"> travel</label>
    <label><input id="chkPrime" type="checkbox"> prime</label>
    <label><input id="chkBall" type="checkbox" checked> ball</label>
    <label><input id="chkFollow" type="checkbox" checked> follow</label>
  </div>
  <div id="info"></div>
  <div id="err"></div>
</div>
<div id="hint">drag: orbit &nbsp; right-drag / shift-drag: pan &nbsp; wheel: zoom &nbsp; space: play / pause &nbsp; , . : step a frame &nbsp; URL: ?clip=skill:roulette&amp;side=-1&amp;foot=-1&amp;seq=0&amp;rate=0.2&amp;player=p3</div>

<script src="../js/vendor/three.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/game.js"></script>
<script src="../js/3d/coords.js"></script>
<script src="../js/3d/player3d.js"></script>
<script src="../js/3d/animkit.js"></script>
<script src="../js/3d/clips-action.js"></script>
<script src="../js/3d/clips-skill.js"></script>
<script src="../js/3d/clips-keeper.js"></script>
<script src="../js/3d/anim3d.js"></script>
<script src="../js/3d/ball3d.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const err = (e) => { $('err').textContent = String(e && e.stack || e); };
  window.addEventListener('error', (e) => err(e.error || e.message));
  const ISO = window.ISO, R3D = ISO.R3D, A = R3D.Anim;

  // ---------------------------------------------------------------- scene
  const canvas = $('cv');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#0f1419');
  scene.fog = new THREE.Fog('#0f1419', 25, 60);
  const cam = new THREE.PerspectiveCamera(40, 1, 0.05, 200);
  scene.add(new THREE.HemisphereLight(0xdfefff, 0x2b4a2f, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 1.7);
  sun.position.set(-6, 12, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 40 }); sun.shadow.bias = -0.0004;
  scene.add(sun, sun.target);
  // pitch with mowing bands and a few lines
  const pc = document.createElement('canvas'); pc.width = pc.height = 512; const pg = pc.getContext('2d');
  for (let i = 0; i < 16; i++) { pg.fillStyle = i % 2 ? '#2f8a45' : '#2a7d3e'; pg.fillRect(0, i * 32, 512, 32); }
  pg.strokeStyle = 'rgba(255,255,255,.75)'; pg.lineWidth = 3; pg.strokeRect(64, 64, 384, 384); pg.beginPath(); pg.moveTo(64, 256); pg.lineTo(448, 256); pg.stroke();
  const ptex = new THREE.CanvasTexture(pc); ptex.colorSpace = THREE.SRGBColorSpace; ptex.wrapS = ptex.wrapT = THREE.RepeatWrapping; ptex.repeat.set(3, 3);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ map: ptex, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  // the ball: the real drawn ball (ball3d.js: skin, size, owned-ball mapping) when it loads, else a plain sphere of the same radius
  const K = R3D.K, BR = K.ballR, SPEED = ISO.C.SPEED || 0.6, S = K.S;
  let ball3d = null;
  try { ball3d = R3D.Ball.create(THREE, ISO.ballById ? ISO.ballById('classic') : 'classic', {}); scene.add(ball3d.mesh); if (ball3d.shadow) scene.add(ball3d.shadow); } catch (e) { ball3d = null; console.warn('ball3d unavailable, plain ball', e); }
  const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(BR, 24, 16), new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.5 }));
  ballMesh.castShadow = true; ballMesh.visible = false; scene.add(ballMesh);
  const bv = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, r: BR, owner: -1, held: false };      // the ball as drawn, what the animator gets
  const vf = { t: 0, phase: 'play', me: 0, attacker: 0, slowmo: false, players: [null], keeper: A.blankKV ? A.blankKV() : { x: 0, z: 60, yaw: 0, state: 'set' },
    ball: { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, spin: 0, owner: -1, held: false, inNet: false, shot: null, rot: 0 } };

  // ---------------------------------------------------------------- orbit camera
  const orb = { yaw: 0.6, pitch: 0.28, dist: 5.2, tx: 0, ty: 0.95, tz: 0 };
  let drag = null;
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointerup', () => { drag = null; });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    if (drag.pan) { const k = orb.dist * 0.0018; orb.tx -= Math.cos(orb.yaw) * dx * k; orb.tz += Math.sin(orb.yaw) * dx * k; orb.ty = Math.max(0, orb.ty + dy * k); $('chkFollow').checked = false; }
    else { orb.yaw -= dx * 0.008; orb.pitch = Math.min(1.45, Math.max(-0.1, orb.pitch + dy * 0.006)); }
  });
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); orb.dist = Math.min(30, Math.max(1.2, orb.dist * Math.exp(e.deltaY * 0.001))); }, { passive: false });
  function placeCam() {
    const cp = Math.cos(orb.pitch);
    cam.position.set(orb.tx + Math.sin(orb.yaw) * cp * orb.dist, orb.ty + Math.sin(orb.pitch) * orb.dist, orb.tz + Math.cos(orb.yaw) * cp * orb.dist);
    cam.lookAt(orb.tx, orb.ty, orb.tz);
  }
  function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  window.addEventListener('resize', resize); resize();

  // ---------------------------------------------------------------- UI
  const opt = (sel, v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); };
  ISO.PLAYERS.forEach((d, i) => opt($('selPlayer'), 'p' + i, d.name + ' (' + d.look.hair + ', ' + (d.look.face || 'oval') + ')'));
  ISO.KEEPERS.forEach((k, i) => opt($('selPlayer'), 'k' + i, 'GK: ' + k.name));
  ISO.SKINS.forEach((s) => opt($('selSkin'), s.id, s.name));
  A.SKILLS.forEach((s) => opt($('selSkill'), s, s));
  const OUT_STATES = A.CLIPS.filter((c) => c.indexOf('skill:') !== 0).concat(['skill']);
  function fillStates(keeper) {
    const sel = $('selState'), cur = sel.value; sel.innerHTML = '';
    (keeper ? A.GK_CLIPS : OUT_STATES).forEach((c) => opt(sel, c, c.replace('gk:', '')));
    if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;
    else sel.value = keeper ? 'gk:set' : 'jog';
  }
  // real seconds for u 0..1: the sim duration of the move at game speed, so speed 1 is what a match shows
  function clipName() { const s = $('selState').value; return s === 'skill' ? 'skill:' + $('selSkill').value : s; }
  function clipDur(c) {
    let d = { 'gk:diveLow': 0.42, 'gk:diveHigh': 0.42, 'gk:jump': 0.46, 'gk:ground': 0.6, 'gk:slide': 0.44, 'gk:catch': 0.35, 'gk:parry': 0.2, 'gk:throw': 0.3, fake: ISO.C.FAKE_T || 0.26, celebrate: 1.2, charge: 0.6 }[c];
    if (c.indexOf('skill:') === 0) d = (ISO.Game.SKILLS[c.slice(6)] || {}).dur;
    const s = A.samplePV(c, 0, 0);
    return (d || (s.kickT > 0.001 ? s.kickT : 0) || s.stDur || 0.72) / SPEED;
  }
  // where the sim would carry the ball in a skill (js/game.js SKFN: forward / sideways / up, px), for the foot-on-ball check
  const lerp = (a, b, t) => a + (b - a) * t, seg = (u, a, b) => Math.min(1, Math.max(0, (u - a) / (b - a))), sm = (x) => x * x * (3 - 2 * x);
  const SKBALL = {
    stepover: (u) => [17, 3.5 * Math.sin(u * Math.PI * 4), 0], feint: (u) => [16, u < 0.45 ? -5 * seg(u, 0, 0.45) : lerp(-5, 7, seg(u, 0.45, 1)), 0],
    knock: (u) => [lerp(15, 34, sm(u)), 0, 0], roll: (u) => [12, 5 + 8 * Math.sin(u * Math.PI), 0], croqueta: (u) => [14, lerp(-9, 10, sm(u)), 0],
    roulette: (u) => [13 * Math.cos(u * Math.PI * 2), 13 * Math.sin(u * Math.PI * 2), 0, true],
    elastico: (u) => [16, u < 0.45 ? -17 * sm(seg(u, 0, 0.45)) : lerp(-17, 20, sm(seg(u, 0.45, 0.75))), 0],
    heel: (u) => [u < 0.35 ? lerp(15, -7, seg(u, 0, 0.35)) : lerp(-7, 44, sm(seg(u, 0.35, 1))), 0, 0],
    rainbow: (u) => { const w = seg(u, 0.28, 1); return [u < 0.28 ? lerp(15, -11, seg(u, 0, 0.28)) : lerp(-11, 62, w), 0, u < 0.28 ? 10 * seg(u, 0.1, 0.28) : 10 + 58 * Math.sin(Math.PI * w) - 10 * w]; },
    dragback: (u) => [lerp(16, -13, sm(seg(u, 0, 0.7))), 0, 0, true], nutmeg: () => [30, 0, 0],
  };

  // ---------------------------------------------------------------- actor
  let actor = null, pv = null, keeper = false;
  function build() {
    try {
      const v = $('selPlayer').value, i = +v.slice(1);
      keeper = v[0] === 'k';
      let spec;
      if (keeper) { const k = ISO.KEEPERS[i]; spec = { def: k, kit: k.kit, keeper: true, slot: 9 }; }
      else { const d = ISO.outfit(ISO.PLAYERS[i], $('chkPrime').checked, $('selSkin').value); spec = { def: d, kit: d.kit, keeper: false, slot: 0 }; }
      if (actor) actor.setSpec(spec);
      else { actor = R3D.Player.create(THREE, spec); A.create(actor); scene.add(actor.group); }
      $('selFoot').value = actor.foot < 0 ? '-1' : '1';
      $('selSkin').disabled = keeper; $('chkPrime').disabled = keeper;
      fillStates(keeper);
      restart();
      let tris = 0, meshes = 0;
      actor.group.traverse((o) => { if (o.isMesh) { meshes++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
      const L = spec.def.look || {};
      info.static = (spec.def.name || '') + '  #' + (spec.def.num == null ? '-' : spec.def.num) + '  ' + (spec.def.foot || 'R') + '-footed\n' +
        'kit ' + spec.kit.a + ' / ' + spec.kit.b + '  ' + spec.kit.pat + '\nlook h ' + (L.h || 1) + ' w ' + (L.w || 1) + '  skin ' + L.skin + '  hair ' + L.hair +
        (L.beard ? '  beard ' + L.beard : '') + (L.brow ? '  brow ' + L.brow : '') + '\n' + meshes + ' meshes, ' + tris + ' tris';
      $('err').textContent = '';
    } catch (e) { err(e); }
  }
  const info = { static: '' };
  // ---- timeline: T = real seconds at speed 1. With "jog > clip > jog": 0.4 s jog (with the ball for moves on the ball; keeper: set), the clip, 0.4 s jog, then it
  // restarts; without it the clip loops. The drawn pose depends on the path (filters), so stepping back or scrubbing replays from 0.
  const PRE = 0.4, st = { T: 0, x: 0, z: 0, ph: 0, ad: 0, vx: 0, vz: 0, simT: 0, first: true, u: 0, cur: '' };
  let playing = true;
  const total = () => clipDur(clipName()) + ($('chkSeq').checked ? 2 * PRE : 0);
  function restart() { st.T = 0; st.x = st.z = st.ph = st.ad = st.simT = 0; st.first = true; if (actor) actor.anim.reset(); if (ball3d && ball3d.reset) ball3d.reset(); }

  function advance(dt) {
    const c = clipName(), dur = clipDur(c), seq = $('chkSeq').checked, sd = +$('selSide').value, foot = +$('selFoot').value;
    if (seq && st.T + dt >= dur + 2 * PRE) restart();
    st.T += dt;
    const tt = seq ? st.T - PRE : st.T % dur, inClip = !seq || (tt >= 0 && tt < dur);
    const cur = inClip ? c : keeper ? 'gk:set' : /^(skill:|fake$|charge$|shield$|dribble$)/.test(c) ? 'dribble' : 'jog', u = inClip ? Math.min(1, Math.max(0, tt / dur)) : 0, dts = dt * SPEED;
    st.u = u; st.cur = cur; st.simT += dts;
    actor.foot = foot;
    pv = A.samplePV(cur, u, st.simT, pv && (keeper === (pv.runPh === undefined)) ? pv : null, { sd, foot });
    // samplePV switches velocity instantly between clips; ease it and keep the stride clocks continuous, as the sim would
    const kv = st.first ? 1 : 1 - Math.exp(-dt / 0.06); st.first = false;
    st.vx += (pv.vx - st.vx) * kv; st.vz += (pv.vz - st.vz) * kv;
    pv.vx = st.vx; pv.vz = st.vz; pv.speed = Math.hypot(st.vx, st.vz);
    if (pv.runPh !== undefined) { st.ph += ((pv.speed * dts) / ((ISO.C.STRIDE || 44) * S * (1 + 0.3 * Math.min(1, pv.speed / pv.top)))) * Math.PI * 2; pv.runPh = st.ph; }
    if (pv.animDist !== undefined) { st.ad += (pv.speed * dts) / S; pv.animDist = st.ad; }
    if ($('chkTravel').checked) { st.x += pv.vx * dts; st.z += pv.vz * dts; if (Math.hypot(st.x, st.z) > 9) { st.x = st.z = 0; actor.anim.reset(); if (ball3d) ball3d.reset(); } }
    pv.x = st.x; pv.z = st.z;
    // the sim ball: carried beside the strong foot, on the skill's path, in front for a strike, in the air for a header /
    // volley / dive. It goes through ball3d (when loaded) so what you see is the ball as the game draws it.
    let fx = Math.sin(pv.yaw), fz = Math.cos(pv.yaw), f = 0.45, r = 0.12 * foot, h = 0;      // forward, to the character's right, up (m)
    const B = vf.ball;
    if (keeper) { f = 0.9; r = pv.state === 'dive' ? -(pv.diveDir || 1) * 2.4 * Math.cos(pv.yaw) : 0; h = pv.high ? 1.9 : pv.state === 'dive' ? 0.3 : 0.9; }
    else if (pv.state === 'skill' && pv.skill && SKBALL[pv.skill.id]) { const o = SKBALL[pv.skill.id](u); f = o[0] * S; r = o[1] * S * sd; h = o[2] * S; if (o[3]) { fx = 0; fz = 1; } }      // roulette / drag back: in the frame the move started in
    else if (pv.owner) { f = 0.25; r = 19 * S * (pv.fakeU > 0 ? pv.fakeSide * (1 - 2 * pv.fakeU) : foot); }
    else h = c === 'header' && inClip ? 1.65 : c === 'volley' && inClip ? 0.55 : 0;
    B.x = pv.x + fx * f - fz * r; B.z = pv.z + fz * f + fx * r; B.y = h; B.vx = pv.vx; B.vz = pv.vz; B.vy = 0;
    B.owner = !keeper && pv.owner ? 0 : -1; B.held = keeper && !!pv.holding;
    vf.players[0] = keeper ? null : pv; if (keeper) vf.keeper = pv; vf.t = st.simT;
    const show = $('chkBall').checked;
    let d = null;
    if (ball3d) { try { ball3d.update(vf, dt); d = ball3d.drawn; } catch (e) { err(e); } }
    bv.x = d ? d.x : B.x; bv.z = d ? d.z : B.z; bv.y = d ? Math.max(0, d.y - BR) : B.y; bv.vx = B.vx; bv.vy = B.vy; bv.vz = B.vz; bv.owner = B.owner; bv.held = B.held;
    if (ball3d) { ball3d.mesh.visible = show; if (ball3d.shadow) ball3d.shadow.visible = show; }
    ballMesh.visible = show && !d; ballMesh.position.set(bv.x, bv.y + BR, bv.z);
    actor.anim.update(pv, dt, show ? bv : null);
  }
  // exact replay from the start to time T (1/60 s steps), for scrubbing and stepping back
  function replay(T) { restart(); const n = Math.max(1, Math.round(T * 60)); for (let i = 0; i < n; i++) advance(T / n); }
  function setPlay(on) { playing = on; $('btnPlay').textContent = on ? 'pause' : 'play'; }
  function step(dir) { setPlay(false); if (dir > 0) advance(1 / 60); else replay(Math.max(1 / 60, st.T - 1 / 60)); }

  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!actor) return;
    try {
      const rate = +$('rngRate').value;
      $('rval').textContent = rate.toFixed(2);
      if (playing) advance(dt * rate);
      const tot = total();
      $('rngU').value = Math.min(1, ($('chkSeq').checked ? st.T : st.T % tot) / tot); $('uval').textContent = st.u.toFixed(2);
      if ($('chkFollow').checked) { const p = actor.group.position; orb.tx += (p.x - orb.tx) * 0.2; orb.tz += (p.z - orb.tz) * 0.2; }
      sun.position.set(orb.tx - 6, 12, orb.tz + 8); sun.target.position.set(orb.tx, 0, orb.tz);
      placeCam();
      renderer.render(scene, cam);
      const P = actor.anim.pose, a = actor.anim.state || {}, n2 = (v) => (typeof v === 'number' ? v.toFixed(2) : '-');
      $('info').textContent = info.static + '\n' + st.cur + '  u ' + st.u.toFixed(3) + '  t ' + st.T.toFixed(3) + ' s  frame ' + Math.round(st.T * 60) + '  state ' + (pv ? pv.state : '') +
        '\nyaw ' + n2(a.yaw) + '  lockW ' + n2(a.lockW) + '  touchW ' + n2(a.touchW) + '  lift ' + n2(P && P[1]) + '  ball r ' + BR + (ball3d ? ' (ball3d)' : ' (plain)');
    } catch (e) { err(e); }
  }
  $('rngU').addEventListener('input', () => { setPlay(false); replay(Math.max(1 / 60, +$('rngU').value * total())); });
  $('btnPlay').addEventListener('click', () => setPlay(!playing));
  $('btnFwd').addEventListener('click', () => step(1)); $('btnBack').addEventListener('click', () => step(-1));
  window.addEventListener('keydown', (e) => { if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); setPlay(!playing); } else if (e.key === '.') step(1); else if (e.key === ',') step(-1); });
  ['selPlayer', 'selSkin', 'chkPrime'].forEach((id) => $(id).addEventListener('change', build));
  ['selState', 'selSkill', 'selSide', 'selFoot', 'chkSeq'].forEach((id) => $(id).addEventListener('change', () => { restart(); if (!playing) replay(1 / 60); }));
  $('selState').addEventListener('change', () => { $('selSkill').disabled = $('selState').value !== 'skill'; });
  $('chkTravel').addEventListener('change', restart);
  // URL parameters: player (p0.. / k0..), clip (a state name or skill:<id>), side, foot (1 / -1), seq (0 = loop the clip), rate, play (0 = paused)
  const q = new URLSearchParams(location.search), has = (sel, v) => [...$(sel).options].some((o) => o.value === v);
  if (q.get('player') && has('selPlayer', q.get('player'))) $('selPlayer').value = q.get('player');
  build();
  const qc = q.get('clip') || '';
  if (qc.indexOf('skill:') === 0 && has('selSkill', qc.slice(6))) { $('selState').value = 'skill'; $('selSkill').value = qc.slice(6); } else if (has('selState', qc)) $('selState').value = qc;
  if (q.get('side') === '-1') $('selSide').value = '-1';
  $('selFoot').value = q.get('foot') === '-1' || (!q.get('foot') && actor && actor.foot < 0) ? '-1' : '1';
  if (q.get('seq') === '0') $('chkSeq').checked = false;
  if (+q.get('rate') > 0) $('rngRate').value = q.get('rate');
  if (q.get('play') === '0') setPlay(false);
  $('selSkill').disabled = $('selState').value !== 'skill';
  restart();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
